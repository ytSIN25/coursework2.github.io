<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <link rel="stylesheet" href="css/header&footer.css">
    <link rel="stylesheet" href="css/studyNotepad.css">
    <link rel="icon" type="image/png" href="images/studyFavicon.png">
</head>

<body>
    <header>
        <img src="images/icon.png">
        <a href="index.html"><div>The<br>Student<br>Hub</div></a>

        <div class="headerLinks">
            <div class="study">
                <a href="study.html" class="studyMain">STUDY</a>
                <div class="studyContent">
                    <a href="studyAssignment.html">Assignment Tracker</a><br>
                    <a href="studyGPA.html">GPA Calculator</a><br>
                    <a href="studyFlashCard.html">Flash Card</a><br>
                    <a href="studyNotepad.html">NotePad</a><br>
                    <a href="studyResourceManager.html">Resource Manager</a><br>
                </div>
            </div>

            <div class="life">
                <a href="life.html" class="lifeMain">LIFE</a>
                <div class="lifeContent">
                    <a href="lifeSchulte.html">Schulte Grid</a><br>
                    <a href="lifeMoney.html">Money Manager</a><br>
                    <a href="lifeTimetable.html">Timetable</a><br>
                    <a href="lifeCalendar.html">Month Calendar</a><br>
                    <a href="lifePomodoro.html">Pomodoro Timer</a>
                </div>
            </div>

            <a href="about.html" class="about">ABOUT</a>
        </div>
    </header>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (!window.matchMedia("(hover: none)").matches) return;

            const menus = [
                { wrapper: ".study", link: ".studyMain" },
                { wrapper: ".life", link: ".lifeMain" }
            ];

            menus.forEach(menu => {
                const wrapper = document.querySelector(menu.wrapper);
                const mainLink = wrapper.querySelector(menu.link);
                let lastTap = 0;

                mainLink.addEventListener("click", (e) => {
                    const now = Date.now();
                    const tapGap = now - lastTap;

                    if (tapGap < 300 && tapGap > 0) {
                        window.location.href = mainLink.getAttribute("href");
                    } else {
                        e.preventDefault();
                        document.querySelectorAll(".studyContent, .lifeContent").forEach(menu => {
                            if (!wrapper.contains(menu)) menu.style.display = "none";
                        });

                        const dropdown = wrapper.querySelector("div");
                        dropdown.style.display =
                            dropdown.style.display === "block" ? "none" : "block";
                    }

                    lastTap = now;
                });
            });

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".study, .life")) {
                    document.querySelectorAll(".studyContent, .lifeContent").forEach(menu => {
                        menu.style.display = "none";
                    });
                }
            });
        });
    </script>

    <main>
        <div class="banner">
            <div class="title">Notepad</div>
            <div class="subtitle">
                A Small and Straight-To-The-Point Little Typing Area.
            </div>
        </div>

        <div class="toolbar">
            <button data-action="decrease">A-</button>
            <button data-action="increase">A+</button>
            <button data-action="export">Export</button>
            <button data-action="clear" class="danger">Clear</button>
        </div>

        <div class="notepad">
            <textarea placeholder="Start writing your notes here..."></textarea>
        </div>

        <div class="statusBar">
            <span class="words">Words: <b id="wordCount">0</b></span>
            <span class="saved">Saved ✓</span>
        </div>
    </main>
    <script type="module" src="script/studyNotepad.js"></script>

    <footer>
        <img src="images/icon.png">
        <div>The<br>Student<br>Hub</div>
        <div class="copyright">
            Made by YT Sin | &copy; COPYRIGHT 2025
        </div>
    </footer>
</body>
</html>
